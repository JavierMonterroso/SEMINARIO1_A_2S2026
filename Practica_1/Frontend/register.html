<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema — Registro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Crear cuenta</h1>
    <form id="register-form">
      <label>
        Correo electronico
        <input type="email" id="correo" required />
      </label>
      <label>
        Nombre completo
        <input type="text" id="nombre_completo" required />
      </label>
      <label>
        Contrasena
        <input type="password" id="contrasena" required minlength="4" />
      </label>
      <label>
        Confirmar contrasena
        <input type="password" id="confirmar_contrasena" required minlength="4" />
      </label>
      <label>
        Foto de perfil
        <input type="file" id="foto_perfil" accept="image/*" capture="user" required />
      </label>
      <p class="error-text" id="error-text"></p>
      <button type="submit" class="primary">Registrarme</button>
    </form>
    <p class="switch">¿Ya tienes cuenta? <a href="index.html">Inicia sesion</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorText = document.getElementById("error-text");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorText.textContent = "";

      const correo = document.getElementById("correo").value.trim();
      const nombreCompleto = document.getElementById("nombre_completo").value.trim();
      const contrasena = document.getElementById("contrasena").value;
      const confirmar = document.getElementById("confirmar_contrasena").value;
      const fotoPerfil = document.getElementById("foto_perfil").files[0];

      if (!isValidEmail(correo)) {
        errorText.textContent = "Ingresa un correo valido.";
        return;
      }

      if (contrasena !== confirmar) {
        errorText.textContent = "Las contrasenas no coinciden.";
        return;
      }

      const submitBtn = form.querySelector("button");
      submitBtn.disabled = true;

      try {
        const { path: fotoPerfilPath } = await Api.uploadImage(fotoPerfil, "perfil");

        const user = await Api.register({
          correo,
          nombre_completo: nombreCompleto,
          contrasena,
          foto_perfil: fotoPerfilPath
        });

        saveSession(user);
        showToast("Cuenta creada correctamente");
        window.location.href = "gallery.html";
      } catch (err) {
        errorText.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
