<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema — Registro</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body class="auth-page">
  <div class="auth-card register-card">
    <h1>Crear cuenta</h1>
    <p class="auth-intro">Completa tus datos para comenzar a crear tu lista de películas.</p>
    <form id="register-form">
      <div class="form-field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" autocomplete="email" required />
      </div>
      <div class="form-field">
        <label for="nombre_completo">Nombre completo</label>
        <input type="text" id="nombre_completo" autocomplete="name" required />
      </div>
      <div class="form-field">
        <label for="contrasena">Contraseña</label>
        <div class="password-input">
          <input type="password" id="contrasena" autocomplete="new-password" required minlength="4" />
          <button type="button" class="password-toggle" data-password-toggle="contrasena" aria-label="Mostrar contraseña">Mostrar</button>
        </div>
        <p class="field-hint">Usa al menos 4 caracteres.</p>
      </div>
      <div class="form-field">
        <label for="confirmar_contrasena">Confirmar contraseña</label>
        <div class="password-input">
          <input type="password" id="confirmar_contrasena" autocomplete="new-password" required minlength="4" />
          <button type="button" class="password-toggle" data-password-toggle="confirmar_contrasena" aria-label="Mostrar confirmación de contraseña">Mostrar</button>
        </div>
        <p id="password-match" class="password-feedback" aria-live="polite">Vuelve a escribir la misma contraseña.</p>
      </div>
      <div class="form-field">
        <label for="foto_perfil">Foto de perfil</label>
        <div class="file-picker">
          <input class="file-input" type="file" id="foto_perfil" accept="image/*" capture="user" required data-file-input />
          <label class="file-picker-button" for="foto_perfil"><span aria-hidden="true">↑</span> Elegir foto</label>
          <span class="file-picker-name" data-file-name-for="foto_perfil">Ningún archivo seleccionado</span>
        </div>
        <p class="field-hint">Selecciona una imagen JPG, PNG o WEBP.</p>
      </div>
      <p class="error-text" id="error-text"></p>
      <button type="submit" class="primary">Registrarme</button>
    </form>
    <p class="switch">¿Ya tienes cuenta? <a href="index.html?v=3">Inicia sesión</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorText = document.getElementById("error-text");
    const passwordInput = document.getElementById("contrasena");
    const confirmPasswordInput = document.getElementById("confirmar_contrasena");
    const passwordMatch = document.getElementById("password-match");

    function updatePasswordMatch() {
      if (!confirmPasswordInput.value) {
        passwordMatch.textContent = "Vuelve a escribir la misma contraseña.";
        passwordMatch.className = "password-feedback";
        return;
      }

      const matches = passwordInput.value === confirmPasswordInput.value;
      passwordMatch.textContent = matches
        ? "✓ Las contraseñas coinciden."
        : "Las contraseñas aún no coinciden.";
      passwordMatch.className = `password-feedback ${matches ? "matches" : "does-not-match"}`;
    }

    passwordInput.addEventListener("input", updatePasswordMatch);
    confirmPasswordInput.addEventListener("input", updatePasswordMatch);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorText.textContent = "";

      const correo = document.getElementById("correo").value.trim();
      const nombreCompleto = document.getElementById("nombre_completo").value.trim();
      const contrasena = document.getElementById("contrasena").value;
      const confirmar = document.getElementById("confirmar_contrasena").value;
      const fotoPerfil = document.getElementById("foto_perfil").files[0];

      if (!isValidEmail(correo)) {
        errorText.textContent = "Ingresa un correo valido.";
        return;
      }

      if (contrasena !== confirmar) {
        errorText.textContent = "Las contrasenas no coinciden.";
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const { path: fotoPerfilPath } = await Api.uploadImage(fotoPerfil, "perfil");

        await Api.register({
          correo,
          nombre_completo: nombreCompleto,
          contrasena,
          foto_perfil: fotoPerfilPath
        });

        clearSession();
        setFlashMessage("¡Registro exitoso! Ya puedes iniciar sesión.");
        window.location.replace("index.html?v=3");
      } catch (err) {
        errorText.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
