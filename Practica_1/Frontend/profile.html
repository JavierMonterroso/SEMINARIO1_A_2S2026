<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema — Mi Perfil</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <nav id="main-nav"></nav>
  <main class="profile-page">
    <header class="profile-header">
      <h1>Mi perfil</h1>
      <p>Actualiza tu información personal y tu foto de perfil.</p>
    </header>
    <div class="profile-card">
      <form id="profile-form">
        <section class="profile-photo-section" aria-label="Foto de perfil">
          <div class="profile-avatar">
            <img id="photo-preview" class="profile-photo-preview" src="" alt="Foto de perfil actual" />
            <input class="file-input" type="file" id="foto_perfil" accept="image/*" data-file-input data-preview-target="photo-preview" />
            <label class="avatar-edit-button" for="foto_perfil" aria-label="Cambiar foto de perfil" title="Cambiar foto de perfil">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 4.5 10.2 3h3.6L15 4.5h3A2.5 2.5 0 0 1 20.5 7v9A2.5 2.5 0 0 1 18 18.5H6A2.5 2.5 0 0 1 3.5 16V7A2.5 2.5 0 0 1 6 4.5h3Zm3 3A4.25 4.25 0 1 0 12 16a4.25 4.25 0 0 0 0-8.5Zm0 2A2.25 2.25 0 1 1 12 14a2.25 2.25 0 0 1 0-4.5Z" />
              </svg>
            </label>
          </div>
          <div class="profile-photo-copy">
            <strong>Foto de perfil</strong>
            <span class="file-picker-name" data-file-name-for="foto_perfil">Toca la cámara para cambiarla</span>
            <small>JPG, PNG o WEBP</small>
          </div>
        </section>
        <div class="form-field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" disabled />
          <p class="field-hint">El correo de la cuenta no se puede modificar.</p>
        </div>
        <div class="form-field">
          <label for="nombre_completo">Nombre completo</label>
          <input type="text" id="nombre_completo" autocomplete="name" required />
        </div>
        <div class="form-field security-field">
          <label for="contrasena_actual">Contraseña actual</label>
          <div class="password-input">
            <input type="password" id="contrasena_actual" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-password-toggle="contrasena_actual" aria-label="Mostrar contraseña actual">Mostrar</button>
          </div>
          <p class="field-hint">La necesitamos para confirmar que eres tú.</p>
        </div>
        <p class="error-text" id="error-text"></p>
        <button type="submit" class="primary">Guardar cambios</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script>
    const user = requireAuth();
    const form = document.getElementById("profile-form");
    const errorText = document.getElementById("error-text");

    if (user) {
      renderNav("profile.html");
      fillForm(user);
    }

    function fillForm(currentUser) {
      document.getElementById("correo").value = currentUser.correo;
      document.getElementById("nombre_completo").value = currentUser.nombre_completo;
      document.getElementById("photo-preview").src = imageUrl(currentUser.foto_perfil);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorText.textContent = "";

      const nombreCompleto = document.getElementById("nombre_completo").value.trim();
      const fotoPerfil = document.getElementById("foto_perfil").files[0];
      const contrasenaActual = document.getElementById("contrasena_actual").value;

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        let fotoPerfilPath;
        if (fotoPerfil) {
          const result = await Api.uploadImage(fotoPerfil, "perfil");
          fotoPerfilPath = result.path;
        }

        const updatedUser = await Api.updateProfile(user.id_usuario, {
          nombre_completo: nombreCompleto,
          foto_perfil: fotoPerfilPath,
          contrasena_actual: contrasenaActual
        });
        saveSession(updatedUser);
        fillForm(updatedUser);
        const passwordInput = document.getElementById("contrasena_actual");
        const passwordToggle = document.querySelector('[data-password-toggle="contrasena_actual"]');
        passwordInput.value = "";
        passwordInput.type = "password";
        passwordToggle.textContent = "Mostrar";
        passwordToggle.setAttribute("aria-label", "Mostrar contraseña actual");
        passwordToggle.classList.remove("is-visible");
        document.getElementById("foto_perfil").value = "";
        const fileName = document.querySelector('[data-file-name-for="foto_perfil"]');
        fileName.textContent = "Toca la cámara para cambiarla";
        fileName.classList.remove("has-file");
        showToast("Perfil actualizado");
      } catch (err) {
        errorText.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
