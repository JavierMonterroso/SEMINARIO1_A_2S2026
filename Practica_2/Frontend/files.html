<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudDrive - Mis archivos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="main-nav">
    <span class="brand">CloudDrive</span>
    <div class="nav-links">
      <a href="tasks.html">Tareas</a>
      <a href="files.html" class="active">Archivos</a>
      <button class="link-button" onclick="handleLogout()">Cerrar sesion</button>
    </div>
  </nav>

  <main>
    <h1>Mis archivos</h1>

    <div class="panel">
      <form id="upload-form" onsubmit="handleUploadFile(event)">
        <div class="form-field">
          <label for="file-input">Archivo</label>
          <input type="file" id="file-input" required />
        </div>
        <button type="submit" class="primary">Subir archivo</button>
        <p id="error-box" class="error-text"></p>
      </form>
    </div>

    <ul id="file-list" class="item-list"></ul>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/files.js"></script>
</body>
</html>
