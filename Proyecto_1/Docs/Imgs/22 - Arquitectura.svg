<svg xmlns="http://www.w3.org/2000/svg" width="2850" height="1050" viewBox="0 0 2850 1050" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura desplegada de Semi-Social</title>
<desc id="desc">El navegador obtiene el frontend desde S3 y llama al Application Load Balancer. El balanceador distribuye las solicitudes entre las EC2 Node.js y Python. Ambas consultan RDS y usan el rol de instancia para acceder a servicios AWS integrados.</desc>
